<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Job Application</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Easy Job Application</h1>
    
    <div class="section">
      <h2>Quick Actions</h2>
      <button id="autofillBtn" class="btn btn-primary">Autofill Current Page</button>
      <button id="detectFieldsBtn" class="btn btn-secondary">Detect Fields</button>
    </div>

    <div class="section">
      <h2>Job Profiles</h2>
      <div class="form-group">
        <label for="profileSelect">Select Profile:</label>
        <select id="profileSelect" class="form-control">
          <option value="">-- New Profile --</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="profileName">Profile Name:</label>
        <input type="text" id="profileName" class="form-control" placeholder="e.g., Software Engineer">
      </div>

      <button id="saveProfileBtn" class="btn btn-success">Save Profile</button>
      <button id="deleteProfileBtn" class="btn btn-danger">Delete Profile</button>
    </div>

    <div class="section">
      <h2>Field Information</h2>
      <div id="fieldsContainer">
        <div class="field-group">
          <label>Full Name:</label>
          <input type="text" data-field="fullName" class="field-input" placeholder="John Doe">
        </div>
        
        <div class="field-group">
          <label>First Name:</label>
          <input type="text" data-field="firstName" class="field-input" placeholder="John">
        </div>
        
        <div class="field-group">
          <label>Last Name:</label>
          <input type="text" data-field="lastName" class="field-input" placeholder="Doe">
        </div>
        
        <div class="field-group">
          <label>Email:</label>
          <input type="email" data-field="email" class="field-input" placeholder="john@example.com">
        </div>
        
        <div class="field-group">
          <label>Phone:</label>
          <input type="tel" data-field="phone" class="field-input" placeholder="555-123-4567">
        </div>
        
        <div class="field-group">
          <label>Address:</label>
          <input type="text" data-field="address" class="field-input" placeholder="123 Main St">
        </div>
        
        <div class="field-group">
          <label>City:</label>
          <input type="text" data-field="city" class="field-input" placeholder="New York">
        </div>
        
        <div class="field-group">
          <label>State:</label>
          <input type="text" data-field="state" class="field-input" placeholder="NY">
        </div>
        
        <div class="field-group">
          <label>Zip Code:</label>
          <input type="text" data-field="zipCode" class="field-input" placeholder="10001">
        </div>
        
        <div class="field-group">
          <label>LinkedIn URL:</label>
          <input type="url" data-field="linkedin" class="field-input" placeholder="https://linkedin.com/in/johndoe">
        </div>
        
        <div class="field-group">
          <label>Portfolio URL:</label>
          <input type="url" data-field="portfolio" class="field-input" placeholder="https://johndoe.com">
        </div>
        
        <div class="field-group">
          <label>Years of Experience:</label>
          <input type="number" data-field="experience" class="field-input" placeholder="5">
        </div>
        
        <div class="field-group">
          <label>Cover Letter:</label>
          <textarea data-field="coverLetter" class="field-input" rows="4" placeholder="Enter cover letter..."></textarea>
        </div>
      </div>
    </div>

    <div id="statusMessage" class="status-message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
